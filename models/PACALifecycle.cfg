SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Authorities = {root, child, grandchild}
    Tenants = {tenantA, tenantB}
    Purposes = {report, otherPurpose}
    Tasks = {task1}
    Actions = {memRead, memWrite, checkpointWrite, toolCall}
    NoAuthority = "NO_AUTHORITY"
    NoTenant = "NO_TENANT"
    NoPurpose = "NO_PURPOSE"
    MaxTaskCalls = 4
    RootAuthority = root
    RootTenant = tenantA
    RootPurpose = report
    RootTask = task1
    RootGrants = {memRead, memWrite, checkpointWrite, toolCall}

INVARIANT TypeOK
INVARIANT LineageAcyclic
INVARIANT CheckpointHasCompleteLineage
INVARIANT PendingWriteBoundToCheckpoint
INVARIANT VisibleRequiresActiveLineageAndAuthority
INVARIANT TaskQuotaBounded
INVARIANT DelegationIsAttenuated
INVARIANT EffectsRequireCommitBoundaryAuthorization

CHECK_DEADLOCK FALSE
