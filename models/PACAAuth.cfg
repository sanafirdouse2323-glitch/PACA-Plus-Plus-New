SPECIFICATION Spec

CONSTANTS
    Ops = {op1, op2}
    Digests = {digest1, digest2}
    NoDigest = "NO_DIGEST"
    Tenants = {tenantA, tenantB}
    OwnerTenant = tenantA
    ToolDigests = {"tool-build-good", "tool-build-untrusted"}
    ExpectedToolDigest = "tool-build-good"
    TrustedApprovers = {"human-approver"}
    NoApprover = "NO_APPROVER"
    MaxCalls = 2
    ParentGrants = {"read:document-A", "write:document-A"}

INVARIANTS
    TypeOK
    CallBudget
    SingleUse
    ExecutionRequiresConsumedToken
    ExecutionRequiresBoundApproval
    TenantIsolation
    ApprovalBoundToExactRequest
    ToolImplementationPinned
    DelegationAttenuated
