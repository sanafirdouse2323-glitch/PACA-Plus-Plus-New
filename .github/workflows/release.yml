name: PAC++ New Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main, "security/**"]
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "paca/**"
      - "paca_executor.py"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: paca-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate release and build Python distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      major_minor: ${{ steps.metadata.outputs.major_minor }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project, development, API, and AgentDojo test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,agentdojo,crypto,providers]"

      - name: Verify package version and derive release tag
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          import paca

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          if paca.__version__ != project_version:
              raise SystemExit(
                  f"paca.__version__ ({paca.__version__!r}) does not match "
                  f"pyproject version ({project_version!r})."
              )

          expected_tag = f"v{project_version}"
          event_name = os.environ["EVENT_NAME"]
          event_ref_type = os.environ["EVENT_REF_TYPE"]
          event_ref_name = os.environ["EVENT_REF_NAME"]

          if event_name == "push" and event_ref_type == "tag":
              if event_ref_name != expected_tag:
                  raise SystemExit(
                      f"Tag {event_ref_name!r} does not match package version; "
                      f"expected {expected_tag!r}."
                  )

          major_minor = ".".join(project_version.split(".")[:2])
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as file:
              file.write(f"version={project_version}\n")
              file.write(f"release_tag={expected_tag}\n")
              file.write(f"major_minor={major_minor}\n")

          print(f"Validated PAC++ New package version {project_version}; release tag is {expected_tag}.")
          PY

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run repository-wide lint, formatting and security-critical type checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy --follow-imports=silent --check-untyped-defs \
            paca_executor.py \
            paca/agent_runtime.py \
            paca/lifecycle.py \
            paca/resource_commit.py \
            paca/filesystem_commit.py \
            paca/authority_runtime.py \
            paca/authority_registry.py \
            paca/durable.py \
            paca/broker.py \
            paca/broker_write.py \
            paca/contracts/canonical.py \
            paca/contracts/signatures.py \
            paca/contracts/broker.py \
            paca/contracts/permits.py

      - name: Verify all installation-profile security contracts
        shell: bash
        run: |
          set -euo pipefail
          for profile in core extended research; do
            echo "Checking profile: $profile"
            PACA_SECURITY_PROFILE="$profile" python -m pytest -q tests/test_profile_security_contract.py
          done

      - name: Verify broker isolation across operating-system UIDs
        run: |
          sudo -E "$(command -v python)" -m pytest -q tests/test_unix_broker.py -k unprivileged_worker_uses_broker_without_direct_file_access

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist

      - name: Install and smoke-test the built wheel and source distribution
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"

          python -m venv /tmp/paca-wheel-env
          /tmp/paca-wheel-env/bin/python -m pip install --upgrade pip
          /tmp/paca-wheel-env/bin/python -m pip install "$wheel" "fastapi>=0.110.0" "uvicorn[standard]>=0.30.0"
          (
            cd /tmp
            /tmp/paca-wheel-env/bin/python - <<'PY'
          import os
          from importlib.metadata import distribution, version

          import paca
          from paca_executor import app

          expected = os.environ["EXPECTED_VERSION"]
          metadata = distribution("paca-plus-plus").metadata
          requirements = metadata.get_all("Requires-Dist") or []
          assert "api" in (metadata.get_all("Provides-Extra") or [])
          assert any(item.lower().startswith("fastapi") and "extra" in item for item in requirements)
          assert any(item.lower().startswith("uvicorn[standard]") and "extra" in item for item in requirements)
          assert version("paca-plus-plus") == expected
          assert paca.__version__ == expected
          assert app.title == "PACA++ Reference Decision API"
          print(f"Wheel installation and import smoke test passed for {expected}.")
          PY
          )

          python -m venv /tmp/paca-sdist-env
          /tmp/paca-sdist-env/bin/python -m pip install --upgrade pip
          /tmp/paca-sdist-env/bin/python -m pip install "$sdist" "fastapi>=0.110.0" "uvicorn[standard]>=0.30.0"
          (
            cd /tmp
            /tmp/paca-sdist-env/bin/python - <<'PY'
          import os
          from importlib.metadata import distribution, version

          import paca
          from paca_executor import app

          expected = os.environ["EXPECTED_VERSION"]
          metadata = distribution("paca-plus-plus").metadata
          requirements = metadata.get_all("Requires-Dist") or []
          assert "api" in (metadata.get_all("Provides-Extra") or [])
          assert any(item.lower().startswith("fastapi") and "extra" in item for item in requirements)
          assert any(item.lower().startswith("uvicorn[standard]") and "extra" in item for item in requirements)
          assert version("paca-plus-plus") == expected
          assert paca.__version__ == expected
          assert app.title == "PACA++ Reference Decision API"
          print(f"Source distribution installation and import smoke test passed for {expected}.")
          PY
          )

      - name: Generate SHA-256 checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload Python release assets
        uses: actions/upload-artifact@v4
        with:
          name: paca-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify-release-tag:
    name: Verify an explicitly pushed, unpublished version tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag target and reject an already published release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ needs.validate-and-build.outputs.release_tag }}
          EVENT_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_TAG" != "$EXPECTED_TAG" ]; then
            echo "Refusing release: event tag $EVENT_TAG does not match package tag $EXPECTED_TAG." >&2
            exit 1
          fi

          tagged_sha="$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")"
          if [ "$tagged_sha" != "$TARGET_SHA" ]; then
            echo "Refusing release: tag $EXPECTED_TAG resolves to $tagged_sha, not $TARGET_SHA." >&2
            exit 1
          fi

          # A matching version string and tag target are not enough: a release
          # must come from the reviewed main-line history. Fetch main explicitly
          # because a tag-triggered checkout may not create origin/main by default.
          git fetch origin main:refs/remotes/origin/main --force
          if ! git merge-base --is-ancestor "$tagged_sha" refs/remotes/origin/main; then
            echo "Refusing release: tag $EXPECTED_TAG does not point to a commit reachable from origin/main." >&2
            exit 1
          fi

          if gh release view "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite the already published $EXPECTED_TAG release." >&2
            exit 1
          fi

          echo "release_tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "Verified new release tag $EXPECTED_TAG at $TARGET_SHA."

  publish-github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish GitHub Release
    needs: [validate-and-build, verify-release-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Python distributions
        uses: actions/download-artifact@v4
        with:
          name: paca-python-distributions
          path: dist/

      - name: Create a new versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --title "PAC++ New $RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

  publish-container:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish version-specific container images
    needs: [validate-and-build, verify-release-tag, publish-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push version-specific image tags
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sanafirdouse2323-glitch/paca-plus-plus-new:${{ needs.verify-release-tag.outputs.release_tag }}
            ghcr.io/sanafirdouse2323-glitch/paca-plus-plus-new:${{ needs.validate-and-build.outputs.version }}
