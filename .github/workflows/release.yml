name: PACA++ Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "paca/**"
      - "paca_executor.py"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "paca/**"
      - "paca_executor.py"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: paca-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate release and build Python distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      major_minor: ${{ steps.metadata.outputs.major_minor }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project, development, API, and AgentDojo test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,agentdojo]"

      - name: Verify package version and derive release tag
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          import paca

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          if paca.__version__ != project_version:
              raise SystemExit(
                  f"paca.__version__ ({paca.__version__!r}) does not match "
                  f"pyproject version ({project_version!r})."
              )

          expected_tag = f"v{project_version}"
          event_name = os.environ["EVENT_NAME"]
          event_ref_type = os.environ["EVENT_REF_TYPE"]
          event_ref_name = os.environ["EVENT_REF_NAME"]

          if event_name == "push" and event_ref_type == "tag":
              if event_ref_name != expected_tag:
                  raise SystemExit(
                      f"Tag {event_ref_name!r} does not match package version; "
                      f"expected {expected_tag!r}."
                  )

          major_minor = ".".join(project_version.split(".")[:2])
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as file:
              file.write(f"version={project_version}\n")
              file.write(f"release_tag={expected_tag}\n")
              file.write(f"major_minor={major_minor}\n")

          print(f"Validated PACA++ package version {project_version}; release tag is {expected_tag}.")
          PY

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run lint and type checks
        run: |
          python -m ruff check paca_executor.py
          python -m mypy --follow-imports=silent paca_executor.py

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist

      - name: Install and smoke-test the built wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"

          python -m venv /tmp/paca-wheel-env
          /tmp/paca-wheel-env/bin/python -m pip install --upgrade pip
          /tmp/paca-wheel-env/bin/python -m pip install "$wheel" "fastapi>=0.110.0" "uvicorn[standard]>=0.30.0"
          (
            cd /tmp
            /tmp/paca-wheel-env/bin/python - <<'PY'
          from importlib.metadata import distribution, version

          import paca
          from paca_executor import app

          metadata = distribution("paca-plus-plus").metadata
          requirements = metadata.get_all("Requires-Dist") or []
          assert "api" in (metadata.get_all("Provides-Extra") or [])
          assert any(item.lower().startswith("fastapi") and "extra" in item for item in requirements)
          assert any(item.lower().startswith("uvicorn[standard]") and "extra" in item for item in requirements)
          assert version("paca-plus-plus") == "0.3.2"
          assert paca.__version__ == "0.3.2"
          assert app.title == "PACA++ Reference Decision API"
          print("Wheel installation and import smoke test passed.")
          PY
          )

          python -m venv /tmp/paca-sdist-env
          /tmp/paca-sdist-env/bin/python -m pip install --upgrade pip
          /tmp/paca-sdist-env/bin/python -m pip install "$sdist" "fastapi>=0.110.0" "uvicorn[standard]>=0.30.0"
          (
            cd /tmp
            /tmp/paca-sdist-env/bin/python - <<'PY'
          from importlib.metadata import distribution, version

          import paca
          from paca_executor import app

          metadata = distribution("paca-plus-plus").metadata
          requirements = metadata.get_all("Requires-Dist") or []
          assert "api" in (metadata.get_all("Provides-Extra") or [])
          assert any(item.lower().startswith("fastapi") and "extra" in item for item in requirements)
          assert any(item.lower().startswith("uvicorn[standard]") and "extra" in item for item in requirements)
          assert version("paca-plus-plus") == "0.3.2"
          assert paca.__version__ == "0.3.2"
          assert app.title == "PACA++ Reference Decision API"
          print("Source distribution installation and import smoke test passed.")
          PY
          )

      - name: Generate SHA-256 checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload Python release assets
        uses: actions/upload-artifact@v4
        with:
          name: paca-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ensure-release-tag:
    name: Create or verify the matching version tag
    if: github.event_name == 'push'
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or verify annotated release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_REF_TYPE" = "tag" ]; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tagged_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged_sha" != "$TARGET_SHA" ]; then
              echo "Existing release tag $RELEASE_TAG points to $tagged_sha, not $TARGET_SHA." >&2
              exit 1
            fi
          else
            if ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
              ref_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
              ref_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
              if [ "$ref_type" = "tag" ]; then
                tagged_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq '.object.sha')"
              else
                tagged_sha="$ref_sha"
              fi
              if [ "$tagged_sha" != "$TARGET_SHA" ]; then
                echo "Refusing to move existing tag $RELEASE_TAG: it points to $tagged_sha, not $TARGET_SHA." >&2
                exit 1
              fi
            else
              tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
                -f "tag=$RELEASE_TAG" \
                -f "message=PACA++ $RELEASE_TAG" \
                -f "object=$TARGET_SHA" \
                -f "type=commit")"
              tag_object_sha="$(printf '%s' "$tag_object" | jq -r '.sha')"
              test -n "$tag_object_sha"
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" \
                -f "sha=$tag_object_sha" >/dev/null
            fi
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Verified release tag $RELEASE_TAG at $TARGET_SHA."

  publish-github-release:
    if: github.event_name == 'push'
    name: Publish GitHub Release
    needs: [validate-and-build, ensure-release-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Python distributions
        uses: actions/download-artifact@v4
        with:
          name: paca-python-distributions
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.ensure-release-tag.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "PACA++ $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi

  publish-container:
    if: github.event_name == 'push'
    name: Publish versioned container image
    needs: [validate-and-build, ensure-release-tag, publish-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sanafirdouse2323-glitch/paca-plus-plus-new
          tags: |
            type=raw,value=${{ needs.ensure-release-tag.outputs.release_tag }}
            type=raw,value=${{ needs.validate-and-build.outputs.version }}
            type=raw,value=${{ needs.validate-and-build.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
