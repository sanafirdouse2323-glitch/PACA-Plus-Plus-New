name: PACA++ CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Generate benchmark artifacts
        if: matrix.python-version == '3.11'
        run: |
          python -m paca bench /tmp/paca-generated
          test -s /tmp/paca-generated/results.json
          test -s /tmp/paca-generated/index.html

      - name: Upload regenerated benchmark
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: paca-benchmark-regenerated
          path: /tmp/paca-generated/

  wheel-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel outside the source tree
        run: |
          python -m venv /tmp/paca-wheel-env
          /tmp/paca-wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/paca-wheel-env/bin/python -c "from paca.monitor import Monitor; m = Monitor(); assert m.rules.policies"


  agentdojo-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PACA++ and pinned AgentDojo integration dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agentdojo]"

      - name: Run AgentDojo adapter tests
        run: pytest -q tests/test_agentdojo_integration.py tests/test_agentdojo_workspace_mapping.py tests/test_agentdojo_benchmark.py

      - name: Smoke-test benchmark CLI without model/API calls
        run: |
          paca-agentdojo --list-injection-tasks > /tmp/agentdojo-injection-tasks.json
          paca-agentdojo --list-supported-tasks > /tmp/agentdojo-supported-tasks.json
          python - <<'PY'
          import json
          from pathlib import Path

          injections = json.loads(Path("/tmp/agentdojo-injection-tasks.json").read_text())
          tasks = json.loads(Path("/tmp/agentdojo-supported-tasks.json").read_text())
          assert injections["injection_task_ids"]
          assert tasks["supported_tasks"]
          supported_ids = {item["user_task_id"] for item in tasks["supported_tasks"]}
          assert {"user_task_1", "user_task_16"}.issubset(supported_ids)
          injection_ids = ",".join(injections["injection_task_ids"])
          print(f"Discovered {len(injections['injection_task_ids'])} injection tasks")
          print(f"Discovered {len(tasks['supported_tasks'])} supported workspace tasks")
          Path("/tmp/all-injection-ids.txt").write_text(injection_ids)
          PY
          injection_ids="$(cat /tmp/all-injection-ids.txt)"
          paca-agentdojo \
            --model gpt-4o-mini-2024-07-18 \
            --user-tasks user_task_1,user_task_16 \
            --injection-tasks "$injection_ids" \
            --attack tool_knowledge \
            --dry-run > /tmp/agentdojo-dry-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/agentdojo-dry-run.json").read_text())
          assert manifest["status"] == "dry_run"
          assert manifest["model"] == "gpt-4o-mini-2024-07-18"
          assert manifest["task_policies"]["user_task_1"]["grants"] == {
              "read_calendar": ["calendar:day:2024-05-15"]
          }
          email_grants = manifest["task_policies"]["user_task_16"]["grants"]["read_mail"]
          assert len(email_grants) == 1
          assert email_grants[0].startswith("mail:search:")
          assert len(email_grants[0].rsplit(":", 1)[-1]) == 24
          applicable = manifest["applicable_injection_task_ids_by_user_task"]
          selected = sorted({item for ids in applicable.values() for item in ids})
          assert selected, "no tool_knowledge injection task applies to selected user tasks"
          Path("/tmp/selected-compatible-injection-ids.txt").write_text(",".join(selected))
          print(f"Preflight identified {sum(len(ids) for ids in applicable.values())} applicable attack pairs.")
          print("Dry-run manifests for both tasks verified; no model calls were made.")
          PY

  agentdojo-real-benchmark:
    if: github.event_name == 'pull_request'
    needs: agentdojo-integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PACA++ and pinned AgentDojo dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agentdojo]"

      - name: Check whether an OpenAI credential is configured
        id: credential
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured; live AgentDojo model runs are skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight bounded live experiment
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        run: |
          paca-agentdojo --list-injection-tasks > /tmp/all-agentdojo-injection-tasks.json
          injection_ids="$(python - <<'PY'
          import json
          from pathlib import Path
          tasks = json.loads(Path("/tmp/all-agentdojo-injection-tasks.json").read_text())
          print(",".join(tasks["injection_task_ids"]))
          PY
          )"
          paca-agentdojo \
            --model gpt-4o-mini-2024-07-18 \
            --user-tasks user_task_1,user_task_16 \
            --injection-tasks "$injection_ids" \
            --attack tool_knowledge \
            --dry-run > /tmp/agentdojo-live-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/agentdojo-live-preflight.json").read_text())
          pairs = data["applicable_injection_task_ids_by_user_task"]
          selected = sorted({item for values in pairs.values() for item in values})
          assert selected, "no compatible attack/task pairs to execute"
          Path("/tmp/selected-compatible-injection-ids.txt").write_text(",".join(selected))
          print(f"Preflight selected {len(selected)} injection IDs across {sum(len(v) for v in pairs.values())} applicable pairs.")
          print("Preflight passed; no model call was made in this step.")
          PY

      - name: Run matched AgentDojo baseline, tool_filter, and PACA++ benchmark
        if: steps.credential.outputs.configured == 'true'
        run: |
          injection_ids="$(cat /tmp/selected-compatible-injection-ids.txt)"
          paca-agentdojo \
            --model gpt-4o-mini-2024-07-18 \
            --user-tasks user_task_1,user_task_16 \
            --injection-tasks "$injection_ids" \
            --attack tool_knowledge \
            --max-iters 12 \
            --log-dir runs/agentdojo-real/logs \
            --output runs/agentdojo-real/results.json

      - name: Upload raw AgentDojo results and logs
        if: always() && steps.credential.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agentdojo-real-benchmark
          path: runs/agentdojo-real/
          if-no-files-found: warn
