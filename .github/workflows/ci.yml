name: PACA++ CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Generate benchmark artifacts
        if: matrix.python-version == '3.11'
        run: |
          python -m paca bench /tmp/paca-generated
          test -s /tmp/paca-generated/results.json
          test -s /tmp/paca-generated/index.html

      - name: Upload regenerated benchmark
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: paca-benchmark-regenerated
          path: /tmp/paca-generated/

  wheel-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel outside the source tree
        run: |
          python -m venv /tmp/paca-wheel-env
          /tmp/paca-wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/paca-wheel-env/bin/python -c "from paca.monitor import Monitor; m = Monitor(); assert m.rules.policies"


  agentdojo-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PACA++ and pinned AgentDojo integration dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agentdojo]"

      - name: Run AgentDojo adapter tests
        run: pytest -q tests/test_agentdojo_integration.py tests/test_agentdojo_workspace_mapping.py tests/test_agentdojo_benchmark.py

      - name: Smoke-test benchmark CLI without model/API calls
        run: |
          paca-agentdojo --list-injection-tasks > /tmp/agentdojo-injection-tasks.json
          paca-agentdojo --list-supported-tasks > /tmp/agentdojo-supported-tasks.json
          python - <<'PY'
          import json
          from pathlib import Path

          injections = json.loads(Path("/tmp/agentdojo-injection-tasks.json").read_text())
          tasks = json.loads(Path("/tmp/agentdojo-supported-tasks.json").read_text())
          assert injections["injection_task_ids"]
          assert tasks["supported_tasks"]
          supported_ids = {item["user_task_id"] for item in tasks["supported_tasks"]}
          assert {"user_task_1", "user_task_16"}.issubset(supported_ids)
          injection_id = injections["injection_task_ids"][0]
          print(f"Discovered {len(injections['injection_task_ids'])} injection tasks")
          print(f"Discovered {len(tasks['supported_tasks'])} supported workspace tasks")
          Path("/tmp/selected-injection-id.txt").write_text(injection_id)
          PY
          injection_id="$(cat /tmp/selected-injection-id.txt)"
          paca-agentdojo \
            --model gpt-4o-2024-05-13 \
            --user-tasks user_task_1,user_task_16 \
            --injection-tasks "$injection_id" \
            --attack tool_knowledge \
            --dry-run > /tmp/agentdojo-dry-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/agentdojo-dry-run.json").read_text())
          assert manifest["status"] == "dry_run"
          assert manifest["injection_task_ids"] == [Path("/tmp/selected-injection-id.txt").read_text()]
          assert manifest["task_policies"]["user_task_1"]["grants"] == {
              "read_calendar": ["calendar:day:2024-05-15"]
          }
          email_grants = manifest["task_policies"]["user_task_16"]["grants"]["read_mail"]
          assert len(email_grants) == 1
          assert email_grants[0].startswith("mail:search:")
          assert len(email_grants[0].rsplit(":", 1)[-1]) == 24
          print("Dry-run manifests for user_task_1 and user_task_16 verified; no model calls were made.")
          PY
