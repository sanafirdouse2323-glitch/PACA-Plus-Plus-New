name: PACA++ CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Generate benchmark artifacts
        if: matrix.python-version == '3.11'
        run: |
          python -m paca bench /tmp/paca-generated
          test -s /tmp/paca-generated/results.json
          test -s /tmp/paca-generated/index.html

      - name: Upload regenerated benchmark
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: paca-benchmark-regenerated
          path: /tmp/paca-generated/

  wheel-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel outside the source tree
        run: |
          python -m venv /tmp/paca-wheel-env
          /tmp/paca-wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/paca-wheel-env/bin/python -c "from paca.monitor import Monitor; m = Monitor(); assert m.rules.policies"


  agentdojo-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PACA++ and pinned AgentDojo integration dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agentdojo]"

      - name: Run AgentDojo adapter tests
        run: pytest -q tests/test_agentdojo_integration.py tests/test_agentdojo_workspace_mapping.py
