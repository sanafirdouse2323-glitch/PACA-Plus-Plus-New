name: PAC++ New Formal Model

on:
  pull_request:
    branches: [main, "security/**"]
    paths:
      - "models/**"
      - "scripts/run_tlc.sh"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    name: TLA+ model checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Run bounded authorization and lifecycle models
        run: bash ./scripts/run_tlc.sh
