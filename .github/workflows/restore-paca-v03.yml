name: Restore PACA v0.3 from verified source archive

on:
  push:
    branches:
      - repair/v0.3-restore-source
    paths:
      - recovery/paca-v03-part-*.b64
      - .github/workflows/restore-paca-v03.yml

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reassemble archive and verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          cat recovery/paca-v03-part-*.b64 | base64 --decode > /tmp/paca-v03-source.tar.gz
          echo "8c165d1f52e467da3593247c704de791afbd328b97afb9e96aef2d540de07791  /tmp/paca-v03-source.tar.gz" | sha256sum --check

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import tarfile

          expected = {
              "paca/parser.py": "a4c835a36eb8e8d56718d4ee381e86e30e20363d",
              "paca/provenance.py": "846bfdda9cd796ba447ca38cffadd6a652056b1f",
              "paca/runtime.py": "ebcac797943be0d991eee05a4cfd6cb099c47372",
              "paca/obligations.py": "090cb13eb0843b56197df360bc1dc420d12a212c",
              "paca/scenarios.py": "b49eca2d8ca800fc71463cf8a9445575a0b070e7",
              "paca/report.py": "1a6104932d462195ef7ddef4ed251bddfce894f7",
              "pyproject.toml": "a745bd9872d7303f81d167ee5f56a2ac5fee87e8",
              "requirements.txt": "039d26e46d77b46fe38c002be58ea9caefc0f3a5",
              "tests/test_bench.py": "6306b809e68e7ca8f9f883d244c39fd7445d5168",
              "tests/test_dsl.py": "1ae139177d4ee61386990830866206d0d8bf9e38",
              "tests/test_monitor.py": "bf385d0d529e2cb4cb1a367e42c65556771187a4",
          }

          archive = Path("/tmp/paca-v03-source.tar.gz")
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              names = [m.name for m in members]
              if len(names) != len(expected) or set(names) != set(expected):
                  raise SystemExit(f"Unexpected archive contents: {names}")
              for member in members:
                  if not member.isfile():
                      raise SystemExit(f"Non-regular file rejected: {member.name}")
                  stream = tf.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"Could not read: {member.name}")
                  data = stream.read()
                  data.decode("utf-8")
                  git_blob = b"blob " + str(len(data)).encode("ascii") + b"\\0" + data
                  actual = hashlib.sha1(git_blob).hexdigest()
                  if actual != expected[member.name]:
                      raise SystemExit(f"Git blob checksum mismatch: {member.name}: {actual}")
                  destination = Path(member.name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  print(f"verified {member.name}: {actual}")
          PY

          rm -f paca_demo.html

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests and documented CLI checks
        run: |
          set -euo pipefail
          pytest -q
          python -m paca list
          python -m paca demo C02 paca
          python -m paca bench /tmp/paca-bench-verified
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/paca-bench-verified/results.json").read_text(encoding="utf-8"))
          assert result["n_attacks"] == 30, result.get("n_attacks")
          assert result["n_benign"] == 11, result.get("n_benign")
          print("Benchmark verified: 30 attack scenarios and 11 benign workflows.")
          PY

      - name: Commit restored source files to the recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch paca_demo.html
          git add paca/parser.py paca/provenance.py paca/runtime.py paca/obligations.py paca/scenarios.py paca/report.py pyproject.toml requirements.txt tests/test_bench.py tests/test_dsl.py tests/test_monitor.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit; refusing to create an empty recovery commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore PACA++ v0.3 source files from verified archive"
          git push origin "$GITHUB_REF_NAME"
