[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paca-plus-plus"
version = "0.3.0"
description = "Provenance-anchored authorization reference monitor and deterministic simulator for selected LLM-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["authorization", "agents", "prompt-injection", "provenance", "llm-security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agentdojo = ["agentdojo==0.1.35"]

[project.scripts]
paca = "paca.cli:main"

[tool.setuptools]
packages = ["paca", "paca.policies"]

[tool.setuptools.package-data]
paca = ["policies/*.paca"]

[tool.pytest.ini_options]
pythonpath = ["."]
