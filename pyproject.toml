[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paca-plus-plus"
version = "0.3.0"
description = "Provenance-anchored continuous authorization for autonomous LLM agents (reference monitor + catalog-driven benchmark)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["authorization", "agents", "prompt-injection", "provenance", "llm-security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paca = "paca.cli:main"

[tool.setuptools]
packages = ["paca"]

[tool.pytest.ini_options]
pythonpath = ["."]
