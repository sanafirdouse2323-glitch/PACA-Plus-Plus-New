[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paca-plus-plus"
version = "0.3.2"
description = "Provenance-anchored authorization reference monitor and deterministic simulator for selected LLM-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PACA-Academic-NonCommercial"
license-files = ["LICENSE"]
keywords = ["authorization", "agents", "prompt-injection", "provenance", "llm-security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0", "ruff==0.17.6", "mypy>=1.11.0", "cryptography>=42.0.0", "jsonschema>=4.23,<5", "rfc8785>=0.1.4,<0.2"]
crypto = ["cryptography>=42.0.0"]
postgres = ["psycopg[binary]>=3.2,<4"]
providers = ["httpx>=0.27.0"]
protocol = ["jsonschema>=4.23,<5", "rfc8785>=0.1.4,<0.2", "cryptography>=42.0.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.30.0"]
agentdojo = ["agentdojo==0.1.35"]
langgraph = ["langgraph==1.2.24", "langchain==1.5.2"]
langgraph-postgres = [
    "langgraph==1.2.24",
    "langchain==1.5.2",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
paca = "paca.cli:main"
paca-agentdojo = "paca.integrations.agentdojo_benchmark:main"
paca-agentdojo-load = "paca.integrations.agentdojo_load:main"

[tool.setuptools]
packages = ["paca", "paca.policies", "paca.integrations", "paca.contracts", "paca.contracts.schemas"]
py-modules = ["paca_executor"]

[tool.setuptools.package-data]
paca = ["policies/*.paca"]
"paca.contracts.schemas" = ["v1.0.0/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# Keep the historical default correctness checks and explicitly enforce the
# additional rule families addressed by the repository-wide cleanup.
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]
